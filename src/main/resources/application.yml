# LearningApplication 的统一配置；无需激活 mq profile。
server:
  # 服务默认仅本机访问；教学 API 仅存在于测试目录，正常启动不会加载。
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: java-learning-project
  main:
    # 项目同时预置 MVC/Gateway 依赖，本服务显式使用 Servlet MVC。
    web-application-type: servlet
  autoconfigure:
    # 这些组件只是原 POM 的学习储备，当前未配置时不启动；后续接入其他中间件时移除对应禁用项并补齐配置。
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          enabled: false
    sentinel:
      enabled: false
  data:
    redis:
      # 原项目已有 Redis 依赖；幂等案例复用 Lettuce/StringRedisTemplate，无需启动 Redisson。
      # TODO：修改为自己的 Redis 地址；Redis 不可用时消费者失败并走有限重试，不降级为“成功”。
      host: ${REDIS_HOST:192.168.66.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  rabbitmq:
    # 这里修改为自己的 RabbitMQ 服务器地址。TODO：修改为真实 MQ 服务器地址。
    host: ${RABBITMQ_HOST:192.168.66.128} # Broker 主机；不能填写管理台的 HTTP 地址。
    port: ${RABBITMQ_PORT:5672} # AMQP 协议端口，管理台通常是 15672。
    username: ${RABBITMQ_USERNAME:test} # 仅占位；guest 默认禁止远程访问，应创建有 vhost 权限的用户。
    password: ${RABBITMQ_PASSWORD:test} # 通过环境变量注入真实密码，不提交到仓库。
    virtual-host: ${RABBITMQ_VHOST:/dev} # 逻辑隔离空间，用户须有 configure/write/read 权限。
    dynamic: ${app.mq.rabbitmq.enabled} # 仅启用 RabbitMQ 时才声明队列/交换机。
    connection-timeout: 3s # 避免不可达占位地址长时间阻塞请求。
    publisher-confirm-type: correlated # 用 CorrelationData 对应每次发布，Confirm 不代表消费者成功。
    publisher-returns: true # 开启无法路由消息的 Return 通知，需与 mandatory 联用。
    template:
      mandatory: true # Exchange 存在但无匹配队列时返回消息，不静默丢弃。
    listener:
      simple:
        auto-startup: ${app.mq.rabbitmq.enabled} # 配置服务器并启用后才启动业务监听。
        acknowledge-mode: auto # Spring AUTO 在业务方法正常返回后 ACK；不是协议级自动 ACK。
        prefetch: 10 # 每个消费者最多预取的未确认消息；大任务应降低以控制内存与公平性。
        concurrency: 1 # 初始消费者数，便于按日志观察。
        max-concurrency: 3 # 容器按负载扩展上限；不代表消息全局有序。
        default-requeue-rejected: false # 失败最终 reject 不回原队列；配合 DLX 避免无限循环。
        retry:
          enabled: true # AUTO 监听的进程内有限重试，不创建“重试队列”。
          stateless: true # 无事务学习案例使用无状态重试。
          max-attempts: 3 # 包含首次：首次 + 两次重试。
          initial-interval: 1s # 第一次重试前等待。
          multiplier: 2 # 退避倍数，下一次等待 2s。
          max-interval: 5s # 单次退避上限。
  kafka:
    # 这里修改为自己的 Kafka 服务器地址。TODO：修改为真实 MQ 服务器地址。
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:192.168.66.128:9092} # 集群引导地址；后续连接以 Broker advertised.listeners 为准。
    admin:
      auto-create: ${app.mq.kafka.enabled} # 由 KafkaAdmin/NewTopics 声明 Topic，不依赖 Broker auto.create.topics.enable。
      fail-fast: false # Broker 未就绪时记录错误；不会把“未连通”伪装成发送成功。
      operation-timeout: 10s # Topic 管理操作超时。
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # 业务 ID 转为字节，参与分区选择。
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # DTO -> JSON；配置类额外支持 DLT 原始 byte[]。
      acks: all # 等待当前 ISR 确认；副本数=1 时仍没有节点级容灾。
      retries: 3 # Producer 协议发送重试，与 Consumer 业务重试完全不同。
      batch-size: 16384 # 每分区批次字节数，有利于吞吐，单位 byte。
      properties:
        linger.ms: 5 # Boot 3.5 无独立 linger-ms 字段，使用 Kafka 原生属性，最多等 5ms 聚批。
        enable.idempotence: true # 防协议重试重复写入，不解决显式发两次/消费重投。
        max.in.flight.requests.per.connection: 5 # 与幂等 Producer 的顺序保障条件一致。
        delivery.timeout.ms: 15000 # 整体投递时限，须大于 request.timeout.ms + linger.ms。
        request.timeout.ms: 5000 # 单次请求等待上限。
        max.block.ms: 5000 # 无元数据/缓冲区不足时，send 在调用线程的最长阻塞。
        spring.json.add.type.headers: false # 固定 DTO 协议，不传 Java 类型名作为外部协议。
    consumer:
      group-id: learning-service-group # 基础任务消费组；订单与统计在注解中分别指定组。
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer # 字节 -> 业务 key。
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer # 捕获非法 JSON，交给错误处理器/DLT。
      enable-auto-commit: false # 禁止按时间自动提交；业务成功后手动 acknowledge。
      auto-offset-reset: earliest # 仅在组没有有效已提交 offset 时从最早保留记录开始；不是每次重启都回放。
      max-poll-records: 10 # 控制每次 poll 量，减少慢业务超过 max.poll.interval 的风险。
      properties:
        allow.auto.create.topics: false # 禁止 Consumer 访问拼错的名字时自动建 Topic。
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.learning.mq.common.dto.MessageEvent # JSON 的明确目标类型。
        spring.json.trusted.packages: com.example.learning.mq.common.dto # 不使用 * 放开任意 Java 类型。
        spring.json.use.type.headers: false # 不接受外部 __TypeId__ 覆盖固定 DTO 协议。
        max.poll.interval.ms: 300000 # 一批业务+重试需在此时间内完成，否则可能 Rebalance。
    listener:
      auto-startup: ${app.mq.kafka.enabled} # 启用 Kafka 后随统一服务启动监听。
      ack-mode: manual_immediate # 消费线程业务成功后立即提交；Recoverer 成功后也提交恢复位置。
      concurrency: 1 # 订单监听单独设为 3，观察三个分区分配。
      missing-topics-fatal: false # Topic 不存在时等待/日志提示，不依赖自动创建掩盖问题。
      log-container-config: false # 不在启动日志中打印完整连接配置。
    properties:
      # 限制离线管理连接等待；不会改变真实服务器配置。
      default.api.timeout.ms: 10000
      request.timeout.ms: 5000
seata:
  enabled: false # 当前案例没有数据库全局事务，不启动 Seata 客户端。
app:
  mq:
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:false} # 修改服务器配置后设为 true，生产者/消费者进入同一服务。
    kafka:
      enabled: ${KAFKA_ENABLED:false} # 两种中间件可以分别启用。
    order-listeners-enabled: true # 正常服务启用订单订阅；教学测试显式关闭，避免竞争同一队列/消费组。
    rabbit-confirm-timeout-ms: 10000 # 调用方等待 Broker Confirm 的上限，不等待消费者完成。
    kafka-replicas: 1 # 单机学习设置；多 Broker 环境可改为 3，先确认有足够节点。
    kafka-retry-count: 2 # Consumer 额外重试次数：与 Producer retries 无关。
    kafka-retry-interval-ms: 1000 # 阻塞当前分区的重试间隔；不要设置过大以免触发 Rebalance。
    idempotency:
      lease-seconds: 300 # PROCESSING 租约；本例短任务无需续租，长任务需要额外设计。
      retention-seconds: 86400 # DONE 保存一天；超过窗口或 Redis 数据丢失可能再次处理。
